[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "undr9"
version = "0.1.1"
description = "Official Python SDK for the UNDR9 graph-memory database."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "UNDR9 Contributors" }]
dependencies = ["httpx>=0.27,<1"]
keywords = ["undr9", "graph", "database", "vector-search", "memory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/undr9/undr9-python"
Repository = "https://github.com/undr9/undr9-python"
Issues = "https://github.com/undr9/undr9-python/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
